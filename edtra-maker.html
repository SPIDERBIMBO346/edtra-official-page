<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDTRA MAKER</title>

<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Minecraft', sans-serif;
    background: #101010 url('fondo.png') center/cover fixed;
    color: white;
    min-height: 100vh;
}

body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    z-index: -1;
}

header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    background: rgba(12, 12, 12, 0.95);
    border-bottom: 1px solid #292929;
}

.logo {
    width: 150px;
    max-height: 55px;
    object-fit: contain;
}

.menu-button {
    background: transparent;
    color: white;
    border: 1px solid #393939;
    padding: 10px 13px;
    font-size: 20px;
    cursor: pointer;
}

.menu {
    display: none;
    position: absolute;
    top: 75px;
    right: 7%;
    background: #171717;
    border: 1px solid #333;
    min-width: 190px;
    z-index: 10;
}

.menu a {
    display: block;
    color: #ddd;
    text-decoration: none;
    padding: 15px;
    font-size: 10px;
    border-bottom: 1px solid #292929;
}

.menu a:hover {
    background: #252525;
    color: #b99aff;
}

.menu.show {
    display: block;
}

main {
    width: 90%;
    max-width: 1000px;
    margin: 55px auto;
}

h1 {
    font-size: clamp(20px, 4vw, 30px);
    margin-bottom: 15px;
}

.description {
    font-size: 10px;
    line-height: 2;
    color: #999;
    margin-bottom: 35px;
}

.section-title {
    font-size: 13px;
    color: #c5aaff;
    margin-bottom: 15px;
}

.tools {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 15px;
}

.tool {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px;
    background: rgba(22, 22, 22, 0.94);
    border: 1px solid #303030;
    border-radius: 5px;
    text-decoration: none;
    color: white;
    transition: border-color 0.2s;
}

.tool:hover {
    border-color: #8e70c9;
}

.tool-icon {
    width: 52px;
    height: 52px;
    object-fit: cover;
    background: #252525;
    border-radius: 4px;
    flex-shrink: 0;
}

.tool-info h3 {
    font-size: 11px;
    margin-bottom: 9px;
}

.tool-info p {
    font-size: 9px;
    color: #999;
    line-height: 1.8;
}

.arrow {
    margin-left: auto;
    color: #888;
    font-size: 17px;
}

.coming-soon {
    opacity: 0.55;
    cursor: default;
}

footer {
    text-align: center;
    padding: 25px 10px;
    color: #666;
    font-size: 8px;
    border-top: 1px solid #252525;
    margin-top: 70px;
}

@media (max-width: 500px) {
    header {
        padding: 0 5%;
    }

    main {
        margin-top: 35px;
    }

    .tools {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <a href="index.html">
        <img src="edtra_maker.png" class="logo" alt="Edtra Maker">
    </a>

    <button class="menu-button" onclick="toggleMenu()">☰</button>

    <nav class="menu" id="menu">
        <a href="index.html">INICIO</a>
        <a href="sociales.html">SOCIAL NETWORK</a>
        <a href="addons.html">ADDONS</a>
    </nav>
</header>

<main>
    <h1>EDTRA MAKER</h1>

    <p class="description">
        Herramientas creadas por Edtra Studio.<br>
        Explora y crea tus propios proyectos.
    </p>

    <h2 class="section-title">HERRAMIENTAS</h2>

    <div class="tools">

        <a href="sound.html" class="tool">
            <img
                src="sound-tool.png"
                class="tool-icon"
                alt="Create Sounds"
                onerror="this.style.display='none'"
            >

            <div class="tool-info">
                <h3>Create Sounds</h3>
                <p>Crea tu propio pack de sonidos para Minecraft Bedrock.</p>
            </div>

            <span class="arrow">›</span>
        </a>

        <!-- Duplica este bloque cuando agregues otra herramienta -->

        <div class="tool coming-soon">
            <div class="tool-icon" style="display:flex;align-items:center;justify-content:center;font-size:22px;">
                +
            </div>

            <div class="tool-info">
                <h3>Próximamente</h3>
                <p>Nuevas herramientas en desarrollo.</p>
            </div>
        </div>

    </div>
</main>

<footer>
    EDTRA STUDIOS © 2026
</footer>

<script>
function toggleMenu() {
    document.getElementById('menu').classList.toggle('show');
}

document.addEventListener('click', function(event) {
    const menu = document.getElementById('menu');
    const button = document.querySelector('.menu-button');

    if (!menu.contains(event.target) && !button.contains(event.target)) {
        menu.classList.remove('show');
    }
});
</script>

</body>
</html>
