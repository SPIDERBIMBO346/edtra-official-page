
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redes Sociales | Edtra Studios</title>

    <link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            text-align: center;
            font-family: 'Minecraft', sans-serif;
            background: url('fondo.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* TÍTULO */

        h1 {
            margin: 0;
            padding-top: 25px;
        }

        h1 img {
            width: 300px;
            max-width: 85%;
            height: auto;
        }

        /* CONTENEDOR DE REDES */

        .container {
            margin: 50px auto 70px;
            padding: 0 15px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        /* ESTILO GENERAL DE BOTONES */

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;

            width: 290px;
            max-width: 100%;
            min-height: 65px;
            padding: 15px 20px;

            color: white;
            text-decoration: none;
            font-family: 'Minecraft', sans-serif;
            font-size: 15px;
            line-height: 1.5;

            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .social-btn svg {
            width: 29px;
            height: 29px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .social-btn span {
            text-align: center;
        }

        /* X / TWITTER */

        .twitter {
            background: #080808;
            border-color: #393939;
            box-shadow: 0 5px 0 #000000;
        }

        .twitter:hover {
            background: #242424;
            border-color: #777777;
            transform: translateY(-4px);
            box-shadow: 0 9px 0 #000000;
        }

        .twitter:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #000000;
        }

        /* DISCORD */

        .discord {
            background: #5865F2;
            border-color: #8992ff;
            box-shadow: 0 5px 0 #303bb0;
        }

        .discord:hover {
            background: #7280ff;
            border-color: #b4baff;
            transform: translateY(-4px);
            box-shadow: 0 9px 0 #303bb0;
        }

        .discord:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #303bb0;
        }

        /* YOUTUBE */

        .youtube {
            background: #FF0033;
            border-color: #ff667f;
            box-shadow: 0 5px 0 #99001f;
        }

        .youtube:hover {
            background: #ff3358;
            border-color: #ff99aa;
            transform: translateY(-4px);
            box-shadow: 0 9px 0 #99001f;
        }

        .youtube:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #99001f;
        }

        /* TIKTOK */

        .tiktok {
            background: #111111;
            border-color: #fe2c55;
            box-shadow: 0 5px 0 #080808;
        }

        .tiktok:hover {
            background: #252525;
            border-color: #25f4ee;
            transform: translateY(-4px);
            box-shadow: 0 9px 0 #080808;
        }

        .tiktok:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #080808;
        }

        /* MENÚ HAMBURGUESA */

        .menu-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 101;

            cursor: pointer;
            background: rgba(0, 0, 0, 0.85);
            padding: 9px 10px;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;

            transition: background 0.2s ease;
        }

        .menu-toggle:hover {
            background: #333333;
        }

        .menu-toggle div {
            width: 27px;
            height: 3px;
            background-color: white;
            margin: 5px 0;
            border-radius: 3px;
        }

        /* MENÚ DESPLEGABLE */

        .menu {
            display: none;
            position: fixed;
            top: 65px;
            left: 15px;
            z-index: 100;

            width: 220px;
            padding: 10px;

            background: rgba(10, 10, 10, 0.96);
            border: 1px solid #444444;
            border-radius: 10px;
            text-align: left;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .menu.open {
            display: block;
            animation: menuAppear 0.18s ease;
        }

        .menu a {
            display: block;
            margin: 6px 0;
            padding: 12px 10px;

            color: white;
            background: #1c1c1c;
            border: 1px solid #393939;
            border-radius: 6px;

            text-decoration: none;
            font-family: 'Minecraft', sans-serif;
            font-size: 11px;
            line-height: 1.7;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .menu a:hover {
            background: #333333;
            border-color: #777777;
        }

        /* MARCA DE AGUA */

        .watermark {
            position: fixed;
            bottom: 10px;
            right: 12px;
            z-index: 5;

            font-size: 10px;
            opacity: 0.75;
            font-family: 'Minecraft', sans-serif;
            text-shadow: 1px 2px 3px black;
            pointer-events: none;
        }

        /* ANIMACIONES */

        @keyframes menuAppear {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* DISEÑO PARA CELULARES */

        @media (max-width: 480px) {
            h1 {
                padding-top: 75px;
            }

            h1 img {
                width: 260px;
            }

            .container {
                margin-top: 40px;
                gap: 20px;
            }

            .social-btn {
                width: 280px;
                min-height: 60px;
                font-size: 13px;
            }

            .watermark {
                font-size: 8px;
            }
        }

        /* ACCESIBILIDAD */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- IMAGEN DEL TÍTULO -->

    <h1>
        <img src="redes.png" alt="Redes sociales">
    </h1>

    <!-- BOTONES DE REDES SOCIALES -->

    <div class="container">

        <!-- X / TWITTER -->

        <a
            class="social-btn twitter"
            href="https://x.com/thezonecrafting?t=uO7nOVRnbHztVwlyjxevPQ&s=09"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitar X o Twitter"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-5-7.1L5.7 22H2.5l7.3-8.4L1.8 2h6.5l4.5 6.6L18.9 2zm-1.1 18h1.7L7.3 3.9H5.5L17.8 20z"/>
            </svg>

            <span>Twitter / X</span>
        </a>

        <!-- DISCORD -->

        <a
            class="social-btn discord"
            href="https://discord.gg/3z2Spr8NuC"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Unirse al Discord"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19.7 5.1a18 18 0 0 0-4.4-1.4l-.5 1a16 16 0 0 0-5.6 0l-.5-1a18 18 0 0 0-4.4 1.4C1.5 9.2.7 13.2 1.1 17.2a18 18 0 0 0 5.4 2.7l1.2-2a11 11 0 0 1-1.9-.9l.5-.4a13 13 0 0 0 11.4 0l.5.4a11 11 0 0 1-1.9.9l1.2 2a18 18 0 0 0 5.4-2.7c.5-4.6-.8-8.6-3.2-12.1ZM8.7 14.5c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm6.6 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/>
            </svg>

            <span>Discord</span>
        </a>

        <!-- YOUTUBE -->

        <a
            class="social-btn youtube"
            href="https://www.youtube.com/@Edtrastudiosoficial"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitar YouTube"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
            </svg>

            <span>YouTube</span>
        </a>

        <!-- TIKTOK -->

        <a
            class="social-btn tiktok"
            href="https://www.tiktok.com/@edtra_club"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitar TikTok"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19.6 6.1a5.5 5.5 0 0 1-3.3-1.1 5.5 5.5 0 0 1-1.9-3.5V1h-3.8v14.7a3.3 3.3 0 1 1-3.3-3.3c.4 0 .8.1 1.2.2V8.7a7.3 7.3 0 1 0 5.9 7.2V8.4a9.2 9.2 0 0 0 5.4 1.7V6.3a5.5 5.5 0 0 1-.2-.2Z"/>
            </svg>

            <span>TikTok</span>
        </a>

    </div>

    <!-- MARCA DE AGUA -->

    <div class="watermark">
        © Edtra Studios 2025
    </div>

    <!-- BOTÓN HAMBURGUESA -->

    <button
        class="menu-toggle"
        type="button"
        onclick="toggleMenu()"
        aria-label="Abrir menú"
        aria-expanded="false"
        aria-controls="menu"
    >
        <div></div>
        <div></div>
        <div></div>
    </button>

    <!-- MENÚ DE NAVEGACIÓN -->

    <nav class="menu" id="menu">
        <a href="index.html">Volver al Inicio</a>
        <a href="edtra-maker.html">Edtra Maker</a>
    </nav>

    <!-- JAVASCRIPT -->

    <script>
        function toggleMenu() {
            const menu = document.getElementById('menu');
            const button = document.querySelector('.menu-toggle');

            const isOpen = menu.classList.toggle('open');

            button.setAttribute('aria-expanded', isOpen);
            button.setAttribute(
                'aria-label',
                isOpen ? 'Cerrar menú' : 'Abrir menú'
            );
        }

        document.addEventListener('click', function(event) {
            const menu = document.getElementById('menu');
            const button = document.querySelector('.menu-toggle');

            if (
                !menu.contains(event.target) &&
                !button.contains(event.target)
            ) {
                menu.classList.remove('open');
                button.setAttribute('aria-expanded', 'false');
                button.setAttribute('aria-label', 'Abrir menú');
            }
        });
    </script>

</body>
</html>
