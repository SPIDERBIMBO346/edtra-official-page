
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Custom PlaySound Studio</title>

<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    min-height: 100vh;

    font-family: 'Minecraft', sans-serif;

    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.65)
        ),
        url("fondo.png")
        no-repeat center center fixed;

    background-size: cover;
}

/* ==============================
   HEADER
============================== */

header {
    text-align: center;
    margin-bottom: 30px;
}

header img {
    width: min(300px, 90%);
    height: auto;
}

/* ==============================
   CONTENEDOR
============================== */

.container {
    width: 95%;
    max-width: 1100px;
    margin: auto;
}

/* ==============================
   TITULOS
============================== */

.title {
    text-align: center;
    font-size: 24px;
    margin-bottom: 20px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}

/* ==============================
   PROYECTOS
============================== */

.project-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));

    gap: 20px;

}

/* ==============================
   TARJETA
============================== */

.project-card {

    background: rgba(0,0,0,.82);

    border: 3px solid #444;

    border-radius: 10px;

    overflow: hidden;

    transition:
        transform .15s,
        border-color .15s;

}

.project-card:hover {

    transform: translateY(-4px);

    border-color: #55ff55;

}

/* ==============================
   IMAGEN PROYECTO
============================== */

.project-image {

    width: 100%;

    height: 180px;

    object-fit: cover;

    image-rendering: pixelated;

    background: #111;

}

/* ==============================
   INFORMACION
============================== */

.project-info {

    padding: 15px;

}

.project-name {

    font-size: 20px;

    margin-bottom: 8px;

    color: #55ff55;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}

.project-namespace {

    color: #aaa;

    font-size: 13px;

    margin-bottom: 8px;

}

.project-sounds {

    color: #ccc;

    font-size: 13px;

}

/* ==============================
   BOTONES
============================== */

button {

    font-family: 'Minecraft', sans-serif;

    padding: 10px 16px;

    margin: 5px;

    font-size: 15px;

    cursor: pointer;

    color: white;

    border: 3px solid #005f00;

    border-radius: 8px;

    background:
        linear-gradient(
            to bottom,
            #00cc00,
            #006600
        );

}

button:hover {

    background:
        linear-gradient(
            to bottom,
            #33ff33,
            #009900
        );

}

button.blue {

    border-color: #064a80;

    background:
        linear-gradient(
            to bottom,
            #2589dd,
            #07528c
        );

}

button.blue:hover {

    background:
        linear-gradient(
            to bottom,
            #4aaaff,
            #0869ad
        );

}

button.red {

    border-color: #700000;

    background:
        linear-gradient(
            to bottom,
            #dd3333,
            #770000
        );

}

button.red:hover {

    background:
        linear-gradient(
            to bottom,
            #ff5555,
            #990000
        );

}

button.gray {

    border-color: #444;

    background:
        linear-gradient(
            to bottom,
            #777,
            #333
        );

}

/* ==============================
   CREAR
============================== */

.create-card {

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 300px;

    background: rgba(0,0,0,.55);

    border: 3px dashed #555;

    border-radius: 10px;

}

.create-card button {

    font-size: 18px;

}

/* ==============================
   MODAL
============================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.85);

    align-items: center;

    justify-content: center;

    z-index: 1000;

    padding: 20px;

}

.modal-box {

    width: 100%;

    max-width: 500px;

    max-height: 90vh;

    overflow-y: auto;

    background: #171717;

    border: 3px solid #555;

    border-radius: 10px;

    padding: 25px;

}

.modal-box h2 {

    margin-top: 0;

    color: #55ff55;

}

.modal-box label {

    display: block;

    margin-top: 15px;

    margin-bottom: 5px;

}

.modal-box input {

    width: 100%;

    padding: 11px;

    font-family: 'Minecraft', sans-serif;

    background: #222;

    border: 2px solid #555;

    color: white;

    border-radius: 6px;

}

/* ==============================
   PREVIEW IMAGEN
============================== */

.image-preview {

    display: none;

    width: 160px;

    height: 160px;

    object-fit: cover;

    image-rendering: pixelated;

    margin: 15px auto;

    border: 3px solid #555;

}

/* ==============================
   EDITOR
============================== */

#editor {

    display: none;

}

.editor-container {

    width: 95%;

    max-width: 1100px;

    margin: auto;

    background: rgba(0,0,0,.85);

    border-radius: 12px;

    padding: 25px;

}

.editor-header {

    display: flex;

    align-items: center;

    gap: 20px;

    flex-wrap: wrap;

    margin-bottom: 25px;

}

.editor-icon {

    width: 100px;

    height: 100px;

    object-fit: cover;

    image-rendering: pixelated;

    border: 3px solid #555;

}

.editor-title {

    flex: 1;

}

.editor-title h1 {

    margin: 0;

    color: #55ff55;

}

.editor-title p {

    color: #aaa;

}

/* ==============================
   CONFIG
============================== */

.panel {

    background: rgba(255,255,255,.05);

    border: 1px solid #444;

    padding: 18px;

    border-radius: 8px;

    margin-bottom: 20px;

}

.panel h2 {

    margin-top: 0;

}

.config-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 15px;

}

.config-grid label {

    display: block;

    margin-bottom: 5px;

    color: #aaa;

}

.config-grid input {

    width: 100%;

    padding: 10px;

    background: #222;

    border: 2px solid #555;

    color: white;

    border-radius: 5px;

    font-family: 'Minecraft', sans-serif;

}

/* ==============================
   SONIDOS
============================== */

.sound-entry {

    background: rgba(0,0,0,.5);

    border: 2px solid #444;

    border-radius: 8px;

    padding: 15px;

    margin-bottom: 12px;

}

.sound-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    flex-wrap: wrap;

}

.sound-number {

    color: #55ff55;

}

.sound-grid {

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

    gap: 10px;

    margin-top: 10px;

}

.sound-grid input,
.sound-grid select {

    width: 100%;

    padding: 9px;

    background: #222;

    color: white;

    border: 2px solid #555;

    border-radius: 5px;

    font-family: 'Minecraft', sans-serif;

}

.sound-id {

    margin-top: 10px;

    color: #aaa;

    font-size: 13px;

}

.sound-id strong {

    color: #55ff55;

}

audio {

    width: 100%;

    margin-top: 12px;

}

/* ==============================
   VACIO
============================== */

.empty {

    text-align: center;

    color: #aaa;

    padding: 50px 20px;

}

/* ==============================
   TOAST
============================== */

#toast {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    background: #111;

    border: 2px solid #55ff55;

    color: white;

    padding: 12px 20px;

    border-radius: 7px;

    display: none;

    z-index: 5000;

}

/* ==============================
   RESPONSIVE
============================== */

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    .project-grid {
        grid-template-columns: 1fr;
    }

    .editor-container {
        padding: 15px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     PANTALLA DE PROYECTOS
===================================================== -->

<div id="projectsScreen">

<header>

<img
src="sonido.png"
alt="Custom PlaySound">

</header>


<div class="container">

<h1 class="title">
🗂️ MIS PROYECTOS
</h1>

<p class="subtitle">
Crea y administra tus Add-Ons de sonidos personalizados
</p>


<div
id="projectGrid"
class="project-grid">
</div>

<!-- =====================================================

===================================================== -->

<div id="editor">

<div class="editor-container">


<div class="editor-header">

<img
id="editorIcon"
class="editor-icon"
src="sonido.png"
>

<div class="editor-title">

<h1 id="editorProjectName">
Proyecto
</h1>

<p id="editorNamespace">
namespace
</p>

</div>

class="gray"

⬅️ Proyectos

<!-- CONFIGURACIÓN -->

<div class="panel">

Nombre del Add-On

>

Cuando exportes se generará un Resource Pack

id="imageModal"

>

Guardar

<script>

/* =====================================================
   INDEXED DB
===================================================== */

const DB_NAME =
"CustomPlaySoundStudio";

const DB_VERSION = 1;

const STORE_NAME =
"projects";

let db;

let currentProjectId = null;


/* =====================================================
   ABRIR DB
===================================================== */

function openDB() {

    return new Promise((resolve,reject) => {

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );


        request.onupgradeneeded =
        function(event) {

            const database =
                event.target.result;


            if (!database.objectStoreNames.contains(STORE_NAME)) {

                database.createObjectStore(
                    STORE_NAME,
                    {
                        keyPath: "id"
                    }
                );

            }

        };


        request.onsuccess =
        function(event) {

            db =
                event.target.result;

            resolve(db);

        };


        request.onerror =
        function() {

            reject(
                request.error
            );

        };

    });

}


/* =====================================================
   GUARDAR PROYECTO
===================================================== */

function saveProject(project) {

    return new Promise(
        (resolve,reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    STORE_NAME
                );

            store.put(project);

            transaction.oncomplete =
                () => resolve();

            transaction.onerror =
                () => reject(
                    transaction.error
                );

        }
    );

}


/* =====================================================
   OBTENER TODOS
===================================================== */

function getProjects() {

    return new Promise(
        (resolve,reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    STORE_NAME
                );

            const request =
                store.getAll();

            request.onsuccess =
                () => resolve(
                    request.result
                );

            request.onerror =
                () => reject(
                    request.error
                );

        }
    );

}


/* =====================================================
   OBTENER UNO
===================================================== */

function getProject(id) {

    return new Promise(
        (resolve,reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    STORE_NAME
                );

            const request =
                store.get(id);

            request.onsuccess =
                () => resolve(
                    request.result
                );

            request.onerror =
                () => reject(
                    request.error
                );

        }
    );

}


/* =====================================================
   ELIMINAR
===================================================== */

function deleteProjectDB(id) {

    return new Promise(
        (resolve,reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    STORE_NAME
                );

            store.delete(id);

            transaction.oncomplete =
                () => resolve();

            transaction.onerror =
                () => reject(
                    transaction.error
                );

        }
    );

}


/* =====================================================
   CREAR PROYECTO
===================================================== */

async function createProject() {

    const name =
        document
        .getElementById("newName")
        .value
        .trim();


    const namespace =
        document
        .getElementById("newNamespace")
        .value
        .trim()
        .toLowerCase();


    if (!name) {

        alert(
            "Escribe un nombre para el proyecto."
        );

        return;

    }


    if (!namespace) {

        alert(
            "Escribe un namespace."
        );

        return;

    }


    const imageInput =
        document
        .getElementById("newImage");


    let imageData = null;


    if (imageInput.files[0]) {

        imageData =
            await fileToDataURL(
                imageInput.files[0]
            );

    }


    const project = {

        id:
            crypto.randomUUID(),

        name:

            name,

        namespace:

            namespace,

        packName:

            name,

        image:

            imageData,

        sounds:

            [],

        created:

            Date.now(),

        modified:

            Date.now()

    };


    await saveProject(project);


    closeCreateModal();

    clearCreateForm();

    await showProjects();

    openEditor(project.id);

}


/* =====================================================
   MOSTRAR PROYECTOS
===================================================== */

async function showProjects() {

    const grid =
        document
        .getElementById(
            "projectGrid"
        );


    grid.innerHTML = "";


    const projects =
        await getProjects();


    if (projects.length === 0) {

        grid.innerHTML = `

        <div class="create-card">

            <button
            onclick="openCreateModal()">

                🆕 Crear mi primer proyecto

            </button>

        </div>

        `;

        return;

    }


    projects
    .sort(
        (a,b) =>
        b.modified -
        a.modified
    )
    .forEach(
        project => {

            const card =
                document
                .createElement("div");

            card.className =
                "project-card";


            const image =
                project.image ||
                "sonido.png";


            card.innerHTML = `

            <img
            class="project-image"
            src="${image}"
            >

            <div class="project-info">

                <div
                class="project-name"
                title="${escapeHTML(project.name)}">

                    ${escapeHTML(project.name)}

                </div>

                <div class="project-namespace">

                    🆔
                    ${escapeHTML(project.namespace)}

                </div>

                <div class="project-sounds">

                    🎵
                    ${project.sounds.length}
                    sonido(s)

                </div>

                <br>

                <button
                onclick="openEditor('${project.id}')">

                    ✏️ Abrir

                </button>

                <button
                class="red"
                onclick="removeProject('${project.id}')">

                    🗑️

                </button>

            </div>

            `;


            grid.appendChild(card);

        }
    );


    const createCard =
        document.createElement("div");

    createCard.className =
        "create-card";


    createCard.innerHTML = `

        <button
        onclick="openCreateModal()">

            ➕ Nuevo proyecto

        </button>

    `;


    grid.appendChild(
        createCard
    );

}


/* =====================================================
   ABRIR EDITOR
===================================================== */

async function openEditor(id) {

    const project =
        await getProject(id);


    if (!project)
        return;


    currentProjectId =
        id;


    document
    .getElementById(
        "projectsScreen"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "editor"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "editorProjectName"
    )
    .textContent =
        project.name;


    document
    .getElementById(
        "editorNamespace"
    )
    .textContent =
        project.namespace;


    document
    .getElementById(
        "packName"
    )
    .value =
        project.packName;


    document
    .getElementById(
        "namespace"
    )
    .value =
        project.namespace;


    document
    .getElementById(
        "editorIcon"
    )
    .src =
        project.image ||
        "sonido.png";


    renderSounds(
        project
    );

}


/* =====================================================
   VOLVER
===================================================== */

async function backToProjects() {

    currentProjectId =
        null;


    document
    .getElementById(
        "editor"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "projectsScreen"
    )
    .style.display =
        "block";


    await showProjects();

}


/* =====================================================
   ACTUALIZAR PROYECTO
===================================================== */

async function updateProject() {

    const project =
        await getProject(
            currentProjectId
        );


    if (!project)
        return;


    project.packName =
        document
        .getElementById(
            "packName"
        )
        .value;


    project.namespace =
        document
        .getElementById(
            "namespace"
        )
        .value
        .trim()
        .toLowerCase();


    project.modified =
        Date.now();


    await saveProject(
        project
    );


    document
    .getElementById(
        "editorProjectName"
    )
    .textContent =
        project.name;


    document
    .getElementById(
        "editorNamespace"
    )
    .textContent =
        project.namespace;


    renderSounds(
        project
    );

}


/* =====================================================
   AGREGAR SONIDO
===================================================== */

async function addSound() {

    const project =
        await getProject(
            currentProjectId
        );


    if (!project)
        return;


    project.sounds.push({

        id:
            crypto.randomUUID(),

        name:
            "",

        path:
            "",

        category:
            "music",

        fileName:
            null,

        fileData:
            null,

        mime:
            "audio/ogg"

    });


    project.modified =
        Date.now();


    await saveProject(
        project
    );


    renderSounds(
        project
    );

}


/* =====================================================
   RENDER SONIDOS
===================================================== */

function renderSounds(project) {

    const list =
        document
        .getElementById(
            "soundList"
        );


    list.innerHTML = "";


    if (
        !project.sounds.length
    ) {

        list.innerHTML = `

        <div class="empty">

            🎵 Todavía no hay sonidos.

            <br><br>

            Pulsa
            <strong>Agregar sonido</strong>
            para comenzar.

        </div>

        `;

        return;

    }


    project.sounds.forEach(
        (sound,index) => {

            const entry =
                document
                .createElement("div");


            entry.className =
                "sound-entry";


            const fullID =
                project.namespace
                ? project.namespace +
                  "." +
                  (sound.name || "sonido")
                : "namespace.sonido";


            entry.innerHTML = `

            <div class="sound-top">

                <span class="sound-number">

                    🎵 Sonido #${index + 1}

                </span>

                <button
                class="red"
                onclick="removeSound('${sound.id}')">

                    ❌ Eliminar

                </button>

            </div>


            <div class="sound-grid">

                <div>

                    <input
                    type="text"
                    placeholder="ID del sonido"
                    value="${escapeHTML(sound.name)}"
                    onchange="updateSoundField('${sound.id}','name',this.value)"
                    >

                </div>


                <div>

                    <input
                    type="text"
                    placeholder="Ruta dentro de sounds/"
                    value="${escapeHTML(sound.path)}"
                    onchange="updateSoundField('${sound.id}','path',this.value)"
                    >

                </div>


                <div>

                    <select
                    onchange="updateSoundField('${sound.id}','category',this.value)"
                    >

                        ${categoryOptions(sound.category)}

                    </select>

                </div>

            </div>


            <div class="sound-id">

                ID:

                <strong>
                    ${escapeHTML(fullID)}
                </strong>

            </div>


            <input
            type="file"
            accept=".ogg,audio/ogg"
            onchange="attachSoundFile('${sound.id}',this.files[0])"
            >


            ${
                sound.fileData
                ?
                `<audio controls src="${sound.fileData}"></audio>`
                :
                `<div class="sound-id">
                    ⚠️ No hay archivo .ogg seleccionado
                </div>`
            }

            `;


            list.appendChild(
                entry
            );

        }
    );

}


/* =====================================================
   CATEGORÍAS
===================================================== */

function categoryOptions(selected) {

    const categories = [

        ["music","Music"],

        ["ambient","Ambient"],

        ["hostile","Hostile"],

        ["player","Player"],

        ["neutral","Neutral"],

        ["block","Block"],

        ["weather","Weather"],

        ["ui","UI"]

    ];


    return categories
    .map(
        category => `

        <option
        value="${category[0]}"
        ${selected === category[0]
            ? "selected"
            : ""}>

            ${category[1]}

        </option>

        `
    )
    .join("");

}


/* =====================================================
   ACTUALIZAR SONIDO
===================================================== */

async function updateSoundField(
    soundId,
    field,
    value
) {

    const project =
        await getProject(
            currentProjectId
        );


    const sound =
        project.sounds.find(
            s => s.id === soundId
        );


    if (!sound)
        return;


    sound[field] =
        value;


    project.modified =
        Date.now();


    await saveProject(
        project
    );


    renderSounds(
        project
    );

}


/* =====================================================
   GUARDAR ARCHIVO OGG
===================================================== */

async function attachSoundFile(
    soundId,
    file
) {

    if (!file)
        return;


    if (
        !file.name
        .toLowerCase()
        .endsWith(".ogg")
    ) {

        alert(
            "El archivo debe ser .ogg"
        );

        return;

    }


    const project =
        await getProject(
            currentProjectId
        );


    const sound =
        project.sounds.find(
            s => s.id === soundId
        );


    if (!sound)
        return;


    sound.fileName =
        file.name;


    sound.fileData =
        await fileToDataURL(file);


    sound.mime =
        file.type ||
        "audio/ogg";


    if (!sound.path) {

        sound.path =
            file.name;

    }


    project.modified =
        Date.now();


    await saveProject(
        project
    );


    renderSounds(
        project
    );


    toast(
        "🎵 Sonido guardado"
    );

}


/* =====================================================
   ELIMINAR SONIDO
===================================================== */

async function removeSound(
    soundId
) {

    if (
        !confirm(
            "¿Eliminar este sonido?"
        )
    )
        return;


    const project =
        await getProject(
            currentProjectId
        );


    project.sounds =
        project.sounds.filter(
            s => s.id !== soundId
        );


    project.modified =
        Date.now();


    await saveProject(
        project
    );


    renderSounds(
        project
    );

}

/* =====================================================
   EXPORTAR MCPACK
===================================================== */

async function exportProject() {

    const project =
        await getProject(
            currentProjectId
        );


    if (!project)
        return;


    if (
        project.sounds.length === 0
    ) {

        alert(
            "Agrega al menos un sonido."
        );

        return;

    }


    const zip =
        new JSZip();


    /* ==============================
       SOUNDS
    ============================== */

    const soundsFolder =
        zip.folder(
            "sounds"
        );


    const definitions = {};


    for (
        const sound of project.sounds
    ) {

        if (
            !sound.name ||
            !sound.path
        ) {

            alert(
                "Todos los sonidos necesitan ID y ruta."
            );

            return;

        }


        if (!sound.fileData) {

            alert(
                `Falta el archivo .ogg de "${sound.name}".`
            );

            return;

        }


        const buffer =
            dataURLToArrayBuffer(
                sound.fileData
            );


        const cleanPath =
            sound.path
            .replace(
                /^\/+/,
                ""
            )
            .replace(
                /\.ogg$/i,
                ""
            );


        soundsFolder.file(
            cleanPath + ".ogg",
            buffer
        );


        const soundID =
            project.namespace +
            "." +
            sound.name;


        definitions[soundID] = {

            category:
                sound.category,

            sounds: [

                "sounds/" +
                cleanPath

            ]

        };

    }


    /* ==============================
       SOUND DEFINITIONS
    ============================== */

    soundsFolder.file(

        "sound_definitions.json",

        JSON.stringify(
            definitions,
            null,
            4
        )

    );


    /* ==============================
       MANIFEST
    ============================== */

    const headerUUID =
        crypto.randomUUID();


    const moduleUUID =
        crypto.randomUUID();


    const manifest = {

        format_version: 2,

        header: {

            name:
                project.packName ||
                project.name,

            description:
                "Custom Sound Pack",

            uuid:
                headerUUID,

            version:
                [1,0,0],

            min_engine_version:
                [1,19,0]

        },

        modules: [

            {

                description:
                    "Custom sounds",

                type:
                    "resources",

                uuid:
                    moduleUUID,

                version:
                    [1,0,0]

            }

        ]

    };


    zip.file(

        "manifest.json",

        JSON.stringify(
            manifest,
            null,
            4
        )

    );


    /* ==============================
       ICON
    ============================== */

    if (project.image) {

        const iconBuffer =
            dataURLToArrayBuffer(
                project.image
            );


        zip.file(
            "pack_icon.png",
            iconBuffer
        );

    }


    /* ==============================
       GENERAR
    ============================== */

    const blob =
        await zip.generateAsync({

            type:
                "blob",

            compression:
                "DEFLATE",

            compressionOptions: {

                level: 6

            }

        });


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        sanitizeFileName(
            project.name
        ) +
        ".mcpack";


    document
    .body
    .appendChild(a);


    a.click();


    a.remove();


    setTimeout(
        () =>
        URL.revokeObjectURL(url),
        1000
    );


    toast(
        "📦 ¡MCPACK generado!"
    );

}

/* =====================================================
   UTILIDADES
===================================================== */

function fileToDataURL(file) {

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                () =>
                resolve(
                    reader.result
                );


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


function dataURLToArrayBuffer(
    dataURL
) {

    const base64 =
        dataURL.split(",")[1];


    const binary =
        atob(base64);


    const bytes =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes.buffer;

}


function sanitizeFileName(name) {

    return name
        .replace(
            /[<>:"/\\|?*]/g,
            ""
        )
        .replace(
            /\s+/g,
            "_"
        )
        .toLowerCase();

}


function escapeHTML(text) {

    return String(
        text ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function toast(message) {

    const element =
        document
        .getElementById(
            "toast"
        );


    element.textContent =
        message;


    element.style.display =
        "block";


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                element.style.display =
                    "none";

            },
            2000
        );

}
